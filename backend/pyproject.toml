[project]
name = "aries-studio-backend"
version = "0.2.0"
description = "Aries Image Studio manager and stage workers: staged Qwen-Image-2.1 inference on Intel XPU"
requires-python = ">=3.12"
license = "MIT"
# torch, torchvision, transformers and diffusers come from the XPU index and git;
# see the Dockerfile for the install order.
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "prometheus-client>=0.20.0",
    "pillow>=10.4.0",
    "psutil>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aries_manager", "aries_worker", "aries_worker.stages"]

[tool.setuptools.package-data]
"aries_worker.stages" = ["system_prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]

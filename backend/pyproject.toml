[project]
name = "aries-image-studio-backend"
version = "0.5.0"
description = "Aries Image Studio thin agent and stage workers: staged Qwen-Image-2.1 inference on Intel XPU"
requires-python = ">=3.12"
license = "MIT"
# torch, torchvision, transformers and diffusers come from the XPU index and git;
# see the Dockerfile for the install order.
dependencies = [
    "prometheus-client>=0.20.0",
    "pillow>=10.4.0",
    "grpcio>=1.84.0",
    "protobuf>=7.35.1",
    "httpx>=0.27.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "grpcio-tools>=1.84.0",
    "ruff>=0.6.0",
    "numpy",  # the stage and contract tests build tensors
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "aries_worker",
    "aries_worker.stages",
    "aries_agent",
    "aries",
    "aries.agent",
    "aries.agent.v1",
]

[tool.setuptools.package-data]
"aries_worker.stages" = ["system_prompt.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]


[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["aries/agent/v1/*_pb2*.py"]

[tool.ruff.lint]
# Bugs only (pyflakes, bugbear); no style rules.
select = ["F", "B"]

# Aries Image Studio V3 thin GPU agent + worker subprocesses.
# Settings come from .env (see .env.example).
services:
  agent:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: aries-image-studio-agent:latest
    container_name: aries-image-studio-agent
    restart: on-failure
    environment:
      - ONEAPI_DEVICE_SELECTOR=${ONEAPI_DEVICE_SELECTOR:-level_zero:0,1}
      - ZE_ENABLE_PCI_ID_DEVICE_ORDER=1
      - HF_HUB_OFFLINE=1
      - ARIES_AGENT_ID=${ARIES_AGENT_ID:-aries}
      - ARIES_BACKEND_KIND=xpu
      - ARIES_BACKEND_GRPC_URL=${ARIES_BACKEND_GRPC_URL:-studio.lan:50051}
      - ARIES_AGENT_TOKEN=${ARIES_AGENT_TOKEN:?set ARIES_AGENT_TOKEN in .env}
      - ARIES_METRICS_LISTEN=0.0.0.0:9464
      - ARIES_METRICS_URL=${ARIES_METRICS_URL:-http://aries.lan:9464/metrics}
      - ARIES_MODEL_PATH=/models/qwen-image-2.1
      - ARIES_ENHANCER_MODEL_PATH=/models/qwen-image-2.1-pe-t2i
      # Image-aware enhancer (Enhance with reference images); ignored until downloaded.
      - ARIES_ENHANCER_I2I_MODEL_PATH=/models/qwen-image-2.1-pe-i2i
      - ARIES_SCRATCH_DIR=/tmp/aries-agent
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"
      - "${VIDEO_GID:-video}"
    volumes:
      - ${MODELS_DIR:-/srv/models}/qwen-image-2.1:/models/qwen-image-2.1:ro
      - ${MODELS_DIR:-/srv/models}/qwen-image-2.1-pe-t2i:/models/qwen-image-2.1-pe-t2i:ro
      - ${MODELS_DIR:-/srv/models}/qwen-image-2.1-pe-i2i:/models/qwen-image-2.1-pe-i2i:ro
      - /tmp/aries-agent:/tmp/aries-agent
    ports:
      - "${METRICS_PORT:-9464}:9464"
    # Liveness only: /readyz (connected to Studio) is 503 while Studio is away, which is
    # not a reason to restart the agent.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9464/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

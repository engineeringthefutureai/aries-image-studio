# Aries Image Studio backend: the manager plus the stage workers it spawns, one container.
# Settings come from .env (see .env.example).
services:
  manager:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: aries-studio-backend:latest
    container_name: aries-studio-manager
    restart: on-failure
    environment:
      - ONEAPI_DEVICE_SELECTOR=${ONEAPI_DEVICE_SELECTOR:-level_zero:0,1}
      - ZE_ENABLE_PCI_ID_DEVICE_ORDER=1
      - HF_HUB_OFFLINE=1
      - MODEL_PATH=/models/qwen-image-2.1
      - ENHANCER_MODEL_PATH=/models/qwen-image-2.1-pe-t2i
      - ARIES_DATA_DIR=/var/lib/aries-studio
      - ARIES_SOCKET_PATH=/run/aries/manager.sock
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-render}"
      - "${VIDEO_GID:-video}"
    volumes:
      - ${MODELS_DIR:-/srv/models}/qwen-image-2.1:/models/qwen-image-2.1:ro
      - ${MODELS_DIR:-/srv/models}/qwen-image-2.1-pe-t2i:/models/qwen-image-2.1-pe-t2i:ro
      - ${DATA_DIR:-/srv/aries-studio/data}:/var/lib/aries-studio
      - /run/aries:/run/aries
    ports:
      - "${PORT:-8000}:8000"

[package]
name = "aries-image-studio"
version = "0.3.0"
edition = "2021"
description = "Aries Image Studio Architecture V3 backend: AgentGateway, scheduler, SQLite state machine, blob store, and public API"
license = "MIT"

[[bin]]
name = "aries-image-studio"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.7", features = ["macros"] }
crc32fast = "1.4"
hex = "0.4"
image = { version = "=0.25.5", default-features = false, features = ["png", "webp"] }
libc = "0.2"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "macros"] }
tokio = { version = "1.40", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.12", features = ["tls"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1.1"

[build-dependencies]
protoc-bin-vendored = "3.0"
tonic-build = "0.12"
